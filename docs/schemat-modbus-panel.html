<text x="40" y="84" font-size="17" fill="#555">Sprawdzone na Rotenso AQM120X3 ze sterownikiem KJRH-120H „Reni”: odczyt i zapis działają od 9.11.2026. Baud 9600, 8N1, Modbus RTU, adres = menu 17.2.</text>

<text x="1225" y="278" font-size="14" fill="#333">• liczniki kWh prądu i ciepła, COP</text>

<!-- ramka ustawień -->
<rect x="40" y="740" width="1720" height="190" rx="14" fill="#f9fafb" stroke="#d1d5db"/>
<text x="60" y="772" font-size="18" font-weight="800" fill="#111">Ustawienia Modbus, które działają</text>
<text x="60" y="802" font-size="15" fill="#333">UART 9600 bps, 8 bitów danych, bez parzystości, 1 bit stopu  •  Modbus RTU, funkcja 03 (holding registers)  •  adres slave = wartość z menu 17.2 (u nas 1)</text>
<text x="60" y="828" font-size="15" fill="#333">Rejestry: 0–12 nastawy użytkownika (tryb, zadane), 100–140 stany i temperatury, 200+ parametry instalatora. Mapa: „Lista Modbus” w instrukcji instalacji Rotenso Aquami (str. 49–60) = ta sama co Midea M-Thermal.</text>
<text x="60" y="854" font-size="15" fill="#333">Projekt odniesienia (ESPHome, ta sama rodzina pomp): github.com/Mosibi/Midea-heat-pump-ESPHome</text>
<text x="60" y="884" font-size="15" fill="#991b1b">Najczęstsze przyczyny „brak komunikacji”: 1) podłączenie do płyty głównej zamiast do sterownika ściennego, 2) HMI SET przestawione na podrzędny, 3) zamienione A/B, 4) zły adres (17.2), 5) parzystość ≠ NONE.</text>
<text x="60" y="912" font-size="13" fill="#777">Rysunek poglądowy, nie zastępuje instrukcji. Przy zaciskach pracujesz przy wyłączonej pompie. Źródło: pompa.woleoze.pl · github.com/WoleOze/rotenso-midea-modbus-ha · 11.2026.</text>
