<text x="40" y="84" font-size="17" fill="#555">Sprawdzone na Rotenso AQM120X3 (Midea), sterownik KJRH-120H „Reni”, odczyt i zapis działają od 9.11.2026. Baud 9600, 8N1, Modbus RTU, adres = menu 17.2.</text>

<text x="730" y="410" text-anchor="middle" font-size="13" fill="#777">po wyjściu z menu serwisanta pompa się wyłącza – włączyć ON</text>

<!-- ramka ustawień -->
<rect x="40" y="680" width="1500" height="180" rx="14" fill="#f9fafb" stroke="#d1d5db"/>
<text x="60" y="712" font-size="18" font-weight="800" fill="#111">Ustawienia Modbus, które działają</text>
<text x="60" y="742" font-size="15" fill="#333">UART 9600 bps, 8 bitów danych, bez parzystości, 1 bit stopu  •  Modbus RTU, funkcja 03 (holding registers)  •  adres slave = wartość z menu 17.2 (u nas 1)</text>
<text x="60" y="768" font-size="15" fill="#333">Rejestry: 0–12 nastawy użytkownika (tryb, zadane), 100–140 stany i temperatury, 200+ parametry instalatora. Mapa: „Lista Modbus” w instrukcji instalacji Rotenso Aquami (str. 49–60) = ta sama co Midea M-Thermal.</text>
<text x="60" y="794" font-size="15" fill="#333">Projekt odniesienia (ESPHome, ta sama rodzina pomp): github.com/Mosibi/Midea-heat-pump-ESPHome  •  Moduł: waveshare.com/wiki/ESP32-S3-Relay-1CH (wersja -U = gniazdo anteny zewnętrznej)</text>
<text x="60" y="824" font-size="15" fill="#991b1b">Najczęstsze przyczyny „brak komunikacji”: 1) podłączenie do płyty głównej zamiast do sterownika ściennego, 2) HMI SET przestawione na podrzędną, 3) zamienione A/B, 4) zły adres (17.2), 5) parzystość ≠ NONE.</text>
<text x="60" y="850" font-size="13" fill="#777">Rysunek poglądowy, nie zastępuje instrukcji. Prace przy zaciskach przy wyłączonym zasilaniu sterownika. Źródło: github.com/WoleOze/rotenso-midea-modbus-ha · woleoze.pl, 11.2026.</text>
