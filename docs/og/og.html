<style>

*{box-sizing:border-box;margin:0}

<body><div class="tlo"></div>

<div class="znaczek" id="znaczek" hidden></div>
<script>
const KOD = `<span class="k"># program modułu · wariant midea · 1.2</span>
<span class="k"># licencja: GNU GPL v3</span>
<span class="n">esphome</span>:
  name: pompa-modbus
  project:
    name: <span class="s">"woleoze.pompa-midea"</span>
    version: <span class="s">"1.2"</span>
<span class="n">update</span>:
  - platform: http_request
    name: <span class="s">"Program modułu"</span>
<span class="n">modbus_controller</span>:
  - address: <span class="w">1</span>   <span class="k"># menu 17.2</span>
    update_interval: <span class="w">10s</span>`;
const S = {
  instrukcja: { etyk: 'Instrukcja montażu', h1: 'Montaż w&nbsp;15&nbsp;minut, <em>krok po kroku</em>',
    pod: 'Dwie żyły do sterownika ściennego, Wi-Fi albo kabel, klucz w&nbsp;Home Assistant. Bez otwierania pompy.',
    pig: ['▶ Film 2 min', 'Schemat H1/H2'], adres: 'pompa.woleoze.pl/instrukcja', img: 'src/film-przewody.jpg', pos: '90% 50%' },
  kreator: { etyk: 'Kreator konfiguracji', h1: 'Twoja pompa w&nbsp;HA <em>w&nbsp;kilka kliknięć</em>',
    pod: 'Wpisz swoje encje i taryfę, a dostaniesz gotowe pakiety, pulpit i listę kroków. Encje zostają w&nbsp;przeglądarce.',

  instalator: { etyk: 'Karta dla instalatora', h1: 'Moduł Modbus: <em>jedna strona A4</em>',
    pod: 'Zaciski H1/H2 na sterowniku ściennym, menu 17.2, Windmi i&nbsp;Heatmi, diagnostyka. Do wydruku.',
    pig: ['PDF do wydruku', 'Kod QR do instrukcji'], adres: 'pompa.woleoze.pl/instalator', img: '../schemat-modbus-panel.png', biala: true },
  'program-modulu': { etyk: 'Program modułu', h1: 'Otwarty program: <em>GNU GPL&nbsp;v3</em>',
    pod: 'Źródło każdej wersji, aktualizacje jednym kliknięciem w&nbsp;Home Assistant, własny program kablem USB-C.',
    pig: ['Źródła wersji', 'Aktualizacje z HA'], adres: 'pompa.woleoze.pl/program-modulu', kod: true },
  regulamin: { etyk: 'Regulamin', h1: 'Zasady jasno: <em>co kupujesz i za ile</em>',
    pod: 'Zestaw to sprzęt, usługa przygotowania i licencja Pro. Odstąpienie, reklamacje, pomoc mailowo.',

  prywatnosc: { etyk: 'Polityka prywatności', h1: 'Twoje dane <em>zostają w&nbsp;domu</em>',
    pod: 'Bez ciasteczek i analityki. Dane pompy działają lokalnie w&nbsp;Home Assistant.',
    pig: ['RODO', 'Bez śledzenia'], adres: 'pompa.woleoze.pl/prywatnosc', lista: true },
};
const k = new URLSearchParams(location.search).get('s') || 'instrukcja', d = S[k];
const $ = (id) => document.getElementById(id);
$('etyk').textContent = d.etyk; $('h1').innerHTML = d.h1; $('pod').innerHTML = d.pod;
$('pigu').innerHTML = d.pig.map((t, i) => `<span class="pig${i === 0 ? ' g' : ''}">${t}</span>`).join('');
$('stopka').innerHTML = '<b>pompa.woleoze.pl</b> · pompy ciepła w Home Assistant, lokalnie';
$('adres').textContent = d.adres;
const w = $('wnetrze');
if (d.img) { w.innerHTML = `<img src="${d.img}" alt="" style="object-position:${d.pos || 'left top'}">`; if (d.biala) $('prawa').classList.add('biala'); }
if (d.kod) w.innerHTML = `<div class="kod">${KOD}</div>`;
if (d.tabela) w.innerHTML = `<div class="karta"><table>
  <tr><th>Zestaw</th><th>Sprzęt</th><th>Usługa</th><th>Licencja</th></tr>
  <tr><td>Wi-Fi</td><td>120 zł</td><td>230 zł</td><td>149 zł</td></tr>
  <tr><td>Wi-Fi + LAN</td><td>150 zł</td><td>250 zł</td><td>149 zł</td></tr>
  <tr><td>Wgranie</td><td>–</td><td>150 zł</td><td>149 zł</td></tr>
  <tr class="raz"><td>Licencja Pro</td><td>–</td><td>–</td><td>149 zł</td></tr></table>
  <p style="margin-top:22px;color:#aab6d3;font-size:18px">14 dni na odstąpienie od sprzętu · rękojmia 2 lata · pomoc 30 dni mailem</p></div>`;
if (d.lista) w.innerHTML = `<div class="karta"><ul class="lista">
  <li><b>✓</b><span>Strona bez ciasteczek i bez analityki</span></li>
  <li><b>✓</b><span>Encje i ustawienia z kreatora nie opuszczają przeglądarki</span></li>
  <li><b>✓</b><span>Raport do wsparcia wysyłasz sam, bez haseł</span></li>
  <li><b>✓</b><span>Nikt nie łączy się z Twoim Home Assistant</span></li>
  <li><b>✓</b><span>Dane zamówień tylko do umowy i faktury</span></li></ul></div>`;
</script>
