        case 65: return {"C7 temperatura modułu inwertera"}; case 112: return {"bH płyta PED"}; case 116: return {"F1 niskie napięcie DC"};
        case 134: return {"L0 moduł inwertera"}; case 135: return {"L1 niskie napięcie DC"}; case 136: return {"L2 wysokie napięcie DC"};
        case 138: return {"L4 MCE"}; case 139: return {"L5 zerowa prędkość"}; case 141: return {"L7 kolejność faz"};
