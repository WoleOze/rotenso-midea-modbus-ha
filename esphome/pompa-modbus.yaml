    name: "Kod błędu"
    update_interval: 15s
    lambda: |-
      if (isnan(id(blad_biezacy).state)) return {};
      int n = (int) id(blad_biezacy).state;
      switch (n) {
        case 0: return {"brak"};
        case 1: return {"E0 przepływ wody (3x E8)"}; case 2: return {"E1 zanik fazy"}; case 3: return {"E2 komunikacja panel-moduł"};
        case 4: return {"E3 czujnik T1"}; case 5: return {"E4 czujnik T5"}; case 6: return {"E5 czujnik T3"}; case 7: return {"E6 czujnik T4"};
