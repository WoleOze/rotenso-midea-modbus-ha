# Rotenso Aquami (AQM120X3; Midea M-Thermal) w Home Assistant przez Modbus RTU i ESPHome
# Wersja Start: tylko odczyt. Zapis nastaw w wersji Pro.
# Repo: https://github.com/WoleOze/rotenso-midea-modbus-ha  (Licencja Start, patrz LICENSE)
#
# Moduł: Waveshare ESP32-S3-Relay-1CH albo ESP32-S3-Relay-1CH-U (piny z przykładu producenta):
#   RS-485 TX = GPIO17, RX = GPIO18, kierunek nadawania DE/RE = GPIO21, przekaźnik = GPIO47 (nieużywany, na stałe wyłączony).
# Podłączenie: zacisk A+ modułu -> H2, zacisk B- modułu -> H1 na płytce STEROWNIKA ŚCIENNEGO (panel KJRH-120H / Rotenso „Reni”),
#   nie na płycie głównej jednostki. Jeśli brak odpowiedzi – zamień A/B. Zasilanie modułu tylko 5 V (USB-C).
# Parametry łącza: 9600 bodów, 8 bitów danych, bez parzystości, 1 bit stopu (9600 8N1). Adres Modbus: menu 17.2 „ADRES HMI DLA BMS” (fabrycznie 1).
# Mapa rejestrów: rozdział „Lista Modbus” w instrukcji serwisowej Rotenso Aquami (str. 49–60) – treści PDF tu nie kopiujemy.
# Odczyt: rejestry 0–9, 100–146, 200–272. Ten plik niczego do pompy nie zapisuje (brak encji number).
# Szczegóły: docs/podlaczenie.md, docs/faq.md.

esphome:
  name: pompa-modbus
  friendly_name: Pompa Modbus
  comment: "Rotenso Aquami / Midea M-Thermal przez Modbus RTU (sterownik ścienny, zaciski H1/H2)."

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG   # UART1 zajęty przez RS-485

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption: {}             # ten sam klucz co api

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pompa-Modbus-awaryjny"
    password: !secret ap_password

captive_portal:

uart:
  id: uart_rs485
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_pompa
  uart_id: uart_rs485
  flow_control_pin: GPIO21

modbus_controller:
  - id: pompa
    modbus_id: modbus_pompa
    address: 1                 # menu 17.2 „ADRES HMI DLA BMS”, fabrycznie 1
    update_interval: 5s        # parametry pracy co 5 s (15 s daje widoczne opóźnienie na karcie)
  - id: pompa_nastawy          # rejestry 0–12: nastawy użytkownika, co 60 s
    modbus_id: modbus_pompa
    address: 1
    update_interval: 60s
  - id: pompa_wolno            # rejestry 200+: parametry instalatora, co 10 min
    modbus_id: modbus_pompa
    address: 1
    update_interval: 600s

# Przekaźnik modułu: NIEUŻYWANY, na stałe wyłączony (nic do niego nie podłączamy)
switch:
  - platform: gpio
    pin: GPIO47
    id: przekaznik_nieuzywany
    internal: true
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    name: "Restart modułu"

sensor:
  # ---------- moduł ----------
  - platform: wifi_signal
    name: "Sygnał Wi-Fi"
    update_interval: 60s
  - platform: uptime
    name: "Czas pracy modułu"
    update_interval: 60s

  # ---------- 100–131: parametry pracy (tylko odczyt) ----------
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 100, value_type: U_WORD, id: spr_hz, name: "Sprężarka częstotliwość", unit_of_measurement: Hz, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 101, value_type: U_WORD, id: tryb_jz, name: "Tryb jednostki zewn. (0 wył, 2 chł, 3 grz)", accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 102, value_type: U_WORD, name: "Wentylator", unit_of_measurement: rpm, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 103, value_type: U_WORD, name: "Zawór rozprężny EEV", unit_of_measurement: P, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 104, value_type: S_WORD, id: tw_in, name: "Woda wejście wymiennika TW_in", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 105, value_type: S_WORD, id: tw_out, name: "Woda wyjście wymiennika TW_out", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 106, value_type: S_WORD, name: "T3 wymiennik jednostki zewn.", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 107, value_type: S_WORD, name: "T4 temperatura zewnętrzna", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 108, value_type: S_WORD, name: "Tp tłoczenie sprężarki", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 109, value_type: S_WORD, name: "Th ssanie sprężarki", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 110, value_type: S_WORD, name: "T1 woda zasilająca (za grzałką)", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 111, value_type: S_WORD, name: "Tw2 strefa 2", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, entity_category: diagnostic}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 112, value_type: S_WORD, name: "T2 czynnik strona cieczy", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 113, value_type: S_WORD, name: "T2B czynnik strona gazu", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  # Ta = czujnik temperatury w sterowniku ściennym (zwykle wisi w salonie); nazwa zostaje, bo karty używają id encji sensor.pompa_modbus_ta_temperatura_w_salonie_panel
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 114, value_type: S_WORD, name: "Ta temperatura w salonie (panel)", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 115, value_type: S_WORD, name: "T5 bojler CWU", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 116, value_type: U_WORD, name: "Ciśnienie wysokie", unit_of_measurement: kPa, device_class: pressure, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 117, value_type: U_WORD, name: "Ciśnienie niskie", unit_of_measurement: kPa, device_class: pressure, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 118, value_type: U_WORD, id: i_zewn, name: "Prąd jednostki zewn.", unit_of_measurement: A, device_class: current, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 119, value_type: U_WORD, id: u_zewn, name: "Napięcie jednostki zewn.", unit_of_measurement: V, device_class: voltage, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 120, value_type: S_WORD, name: "Tbt1 bufor góra", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, entity_category: diagnostic, filters: [{filter_out: 255.0}]}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 121, value_type: S_WORD, name: "Tbt2 bufor dół", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, entity_category: diagnostic, filters: [{filter_out: 255.0}]}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 122, value_type: U_WORD, name: "Sprężarka czas pracy", unit_of_measurement: h, state_class: total_increasing, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 123, value_type: U_WORD, name: "Moc jednostki (kod)", accuracy_decimals: 0, entity_category: diagnostic}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 124, value_type: U_WORD, id: blad_biezacy, name: "Błąd bieżący (nr)", accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 125, value_type: U_WORD, name: "Błąd poprzedni 1 (nr)", accuracy_decimals: 0, entity_category: diagnostic}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 126, value_type: U_WORD, name: "Błąd poprzedni 2 (nr)", accuracy_decimals: 0, entity_category: diagnostic}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 127, value_type: U_WORD, name: "Błąd poprzedni 3 (nr)", accuracy_decimals: 0, entity_category: diagnostic}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 130, value_type: U_WORD, name: "Wersja oprogramowania modułu hydr.", accuracy_decimals: 0, entity_category: diagnostic}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 131, value_type: U_WORD, name: "Wersja panelu", accuracy_decimals: 0, entity_category: diagnostic}

  # ---------- 132–142 ----------
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 132, value_type: U_WORD, reuse_previous_range: false, name: "Sprężarka częstotliwość docelowa", unit_of_measurement: Hz, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 133, value_type: U_WORD, name: "Prąd szyny DC", unit_of_measurement: A, device_class: current, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 134, value_type: U_WORD, name: "Napięcie szyny DC", unit_of_measurement: V, device_class: voltage, state_class: measurement, accuracy_decimals: 0, entity_category: diagnostic, filters: [{multiply: 10}]}   # opis: wartość/10; 49 → 490 V (do potwierdzenia)
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 135, value_type: S_WORD, name: "Temperatura modułu inwertera TF", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 136, value_type: S_WORD, name: "T1S z krzywej strefa 1", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 137, value_type: S_WORD, name: "T1S z krzywej strefa 2", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, entity_category: diagnostic, filters: [{filter_out: 255.0}]}
  - platform: modbus_controller
    modbus_controller_id: pompa
    register_type: holding
    address: 138
    value_type: U_WORD
    id: przeplyw
    name: "Przepływ wody (wyliczany przez pompę)"
    unit_of_measurement: "m³/h"
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 139, value_type: U_WORD, name: "Schemat limitu prądu", accuracy_decimals: 0, entity_category: diagnostic}
  - platform: modbus_controller
    modbus_controller_id: pompa
    register_type: holding
    address: 140
    value_type: U_WORD
    name: "Moc modułu hydraulicznego (wg pompy)"
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 141, value_type: S_WORD, name: "Tsolar", unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, entity_category: diagnostic, filters: [{filter_out: 255.0}]}

  # ---------- 143–146: liczniki kWh (zgodne co do kWh z licznikami w aplikacji Midea) ----------
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 143, value_type: U_DWORD, reuse_previous_range: false, name: "Licznik prądu pompy", unit_of_measurement: kWh, device_class: energy, state_class: total_increasing, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: pompa, register_type: holding, address: 145, value_type: U_DWORD, name: "Licznik ciepła pompy", unit_of_measurement: kWh, device_class: energy, state_class: total_increasing, accuracy_decimals: 0}

  # ---------- 0–9: nastawy użytkownika (odczyt) ----------
  - {platform: modbus_controller, modbus_controller_id: pompa_nastawy, register_type: holding, address: 1, value_type: U_WORD, reuse_previous_range: false, name: "Tryb pracy (1 auto, 2 chł, 3 grz)", accuracy_decimals: 0, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_nastawy, register_type: holding, address: 2, value_type: U_WORD, bitmask: 0x00FF, name: "Zadana woda strefa 1 (rej. 2)", unit_of_measurement: "°C", accuracy_decimals: 0, state_class: measurement}
  - platform: modbus_controller
    modbus_controller_id: pompa_nastawy
    register_type: holding
    address: 3
    value_type: U_WORD
    name: "Zadana temperatura pokoju"
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.5
  - {platform: modbus_controller, modbus_controller_id: pompa_nastawy, register_type: holding, address: 4, value_type: U_WORD, name: "Zadana CWU", unit_of_measurement: "°C", accuracy_decimals: 0, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_nastawy, register_type: holding, address: 6, value_type: U_WORD, bitmask: 0x00FF, name: "Numer krzywej strefa 1", accuracy_decimals: 0, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_nastawy, register_type: holding, address: 7, value_type: U_WORD, name: "Wymuszone grzanie CWU (0 brak, 1 wł, 2 wył)", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_nastawy, register_type: holding, address: 8, value_type: U_WORD, name: "Wymuszona grzałka TBH (0 brak, 1 wł, 2 wył)", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_nastawy, register_type: holding, address: 9, value_type: U_WORD, name: "Wymuszona grzałka IBH (0 brak, 1 wł, 2 wył)", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_nastawy, register_type: holding, address: 5, value_type: U_WORD, name: "Rej. 5 funkcje (surowe bity)", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  # rejestry 11–12 pominięte: starsze panele KJRH-120H (2018 r.) odpowiadają wyjątkiem 2 (nieznany adres); zadana woda jest w rej. 2

  # ---------- 200–235: parametry instalatora + surowe 210/211 (przełączniki z menu serwisanta) (odczyt co ok. 10 min) ----------
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 200, value_type: U_WORD, reuse_previous_range: false, name: "Typ urządzenia (kod)", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 203, value_type: U_WORD, bitmask: 0x00FF, name: "Max T1S grzanie strefa 1", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 204, value_type: U_WORD, bitmask: 0x00FF, name: "Min T1S grzanie strefa 1", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 207, value_type: U_WORD, name: "Max zadana CWU", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 208, value_type: U_WORD, name: "Min zadana CWU", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 210, value_type: U_WORD, name: "Rej. 210 przełączniki (surowe bity)", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 211, value_type: U_WORD, name: "Rej. 211 przełączniki (surowe bity)", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 212, value_type: U_WORD, name: "1.6 dT5_ON", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 213, value_type: U_WORD, name: "1.7 dT1S5", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 215, value_type: S_WORD, name: "1.8 T4DHWMAX", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 216, value_type: S_WORD, name: "1.9 T4DHWMIN", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 217, value_type: U_WORD, name: "1.13 t_TBH_DELAY", unit_of_measurement: min, accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 219, value_type: S_WORD, name: "1.12 T4_TBH_ON", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 220, value_type: U_WORD, name: "1.14 T5S_DI dezynfekcja", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 228, value_type: U_WORD, name: "3.7 t_INTERVAL_H", unit_of_measurement: min, accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 229, value_type: U_WORD, name: "3.5 dT1SH histereza grzania", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 230, value_type: U_WORD, name: "3.6 dTSH", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 231, value_type: S_WORD, name: "3.3 T4HMAX", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 232, value_type: S_WORD, name: "3.4 T4HMIN", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 233, value_type: S_WORD, name: "7.3 T4_IBH_ON", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 234, value_type: U_WORD, name: "7.1 dT1_IBH_ON", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 235, value_type: U_WORD, name: "7.2 t_IBH_DELAY", unit_of_measurement: min, accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}

  # ---------- 241–252 ----------
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 241, value_type: U_WORD, reuse_previous_range: false, name: "1.18 t_DHWHP_MAX", unit_of_measurement: min, accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 242, value_type: U_WORD, name: "1.17 t_DHWHP_RESTRICT", unit_of_measurement: min, accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - platform: modbus_controller
    modbus_controller_id: pompa_wolno
    register_type: holding
    address: 250
    value_type: U_WORD
    name: "7.8 P_IBH1 moc grzałki"
    state_class: measurement
    unit_of_measurement: kW
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: pompa_wolno
    register_type: holding
    address: 251
    value_type: U_WORD
    name: "7.9 P_IBH2 moc grzałki"
    state_class: measurement
    unit_of_measurement: kW
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: pompa_wolno
    register_type: holding
    address: 252
    value_type: U_WORD
    name: "7.10 P_TBH moc grzałki bojlera"
    state_class: measurement
    unit_of_measurement: kW
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  # ---------- 265–272: krzywa nr 9 i typ odbiornika ----------
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 265, value_type: U_WORD, reuse_previous_range: false, name: "3.8 T1SetH1 krzywa 9 woda w mróz", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 266, value_type: U_WORD, name: "3.9 T1SetH2 krzywa 9 woda w cieple", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 267, value_type: S_WORD, name: "3.10 T4H1 krzywa 9 punkt mróz", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 268, value_type: S_WORD, name: "3.11 T4H2 krzywa 9 punkt ciepło", unit_of_measurement: "°C", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 269, value_type: U_WORD, name: "14.1 Ograniczenie mocy (typ)", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}
  - {platform: modbus_controller, modbus_controller_id: pompa_wolno, register_type: holding, address: 272, value_type: U_WORD, bitmask: 0x000F, name: "3.12 Odbiornik strefa 1 grzanie (0 FCU, 1 grzejniki, 2 podłoga)", accuracy_decimals: 0, entity_category: diagnostic, state_class: measurement}

  # ---------- wyliczane ----------
  - platform: template
    name: "Moc cieplna z przepływu i ΔT (wg czujników pompy)"
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      if (isnan(id(przeplyw).state) || isnan(id(tw_out).state) || isnan(id(tw_in).state) || isnan(id(spr_hz).state)) return NAN;
      if (id(spr_hz).state <= 0) return 0.0f;
      return id(przeplyw).state * 1.163f * (id(tw_out).state - id(tw_in).state);
  # Moc elektryczna SZACOWANA z napięcia i prądu jednostki zewnętrznej (rej. 118/119): U × I × √3 × cos φ (0,95).
  # Prąd ma rozdzielczość 1 A, więc błąd ok. ±400 W. Gdy sprężarka stoi (0 Hz) = 0 W. Kto ma własny licznik – niech użyje licznika.
  - platform: template
    name: "Moc elektryczna szacowana"
    id: moc_el_szac
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (isnan(id(spr_hz).state) || isnan(id(u_zewn).state) || isnan(id(i_zewn).state)) return NAN;
      if (id(spr_hz).state <= 0) return 0.0f;
      return id(u_zewn).state * id(i_zewn).state * 1.73f * 0.95f;

